<div class="container">

  <h2>Job Search</h2>

  <div class="search-bar">

	  <input
	    type="text"
	    [(ngModel)]="title"
	    placeholder="Job Title">
	
	  <input
	    type="text"
	    [(ngModel)]="city"
	    placeholder="City">
	
	  <select [(ngModel)]="type">
	    <option value="remote">Remote</option>
	    <option value="hybrid">Hybrid</option>
	    <option value="inperson">In Person</option>
	  </select>
	
	  <button (click)="searchJobs()">
	    Search Jobs
	  </button>
	
	</div><br><br>
  <div *ngFor="let job of jobs">

    <div class="job-card">

        <h2>{{ job.title }}</h2>
        
        <p><strong>Company:</strong> {{ job.companyName }}</p>

        <p>{{ job.city }}</p>

        <p>{{ job.type }}</p>
        
     	<a
		  [href]="job.applyLink"
		  target="_blank"
		  rel="noopener noreferrer"
		  class="apply-btn">
		
		  Apply Now
		</a>		
    </div>

</div>
