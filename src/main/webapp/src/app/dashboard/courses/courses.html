<div class="courses-container">

  <!-- TOP HEADER -->
  <div class="courses-header">
    <div>
      <h2>My Courses</h2>
      <a routerLink="/dashboard" class="back-link">← Back</a>
    </div>
  </div>

  <!-- ADD COURSE CARD -->
  <div class="add-course-card">

    <h3>Add New Course</h3>

    <div class="course-form">
      <input type="text" placeholder="Course Name" [(ngModel)]="newCourse.courseName" />

      <input type="text" placeholder="Term (e.g. Fall 2024)" [(ngModel)]="newCourse.term" />

      <button class="add-btn" [disabled]="isEditing" (click)="addCourse()">
        Add Course
      </button>

      @if (isEditing) {
      <button class="update-btn" (click)="updateCourse()">Update</button>
      <button class="cancel-btn" (click)="cancelEdit()">Cancel</button>
      }
    </div>

  </div>

  <!-- COURSES GRID -->
  <div class="courses-grid">

    @for (c of courses; track c.id) {
    <div class="course-card">

      <div class="course-info">
        <h3>{{ c.courseName }}</h3>
        <p>{{ c.term }}</p>
      </div>

      <div class="course-actions">
        <button class="edit-btn" (click)="editCourse(c)">Edit</button>
        <button class="delete-btn" (click)="openDeleteConfirm(c.id)">Delete</button>
      </div>

    </div>
    }

  </div>

  <!-- alert box -->
	@if (confirmDeleteId !== null) {
	<div class="delete-overlay">
		<div class="delete-box">
			<p>Delete this entry?</p>

			<div class="delete-actions">
				<button class="confirm-cancel-btn" (click)="closeDeleteConfirm()">Cancel</button>
				<button class="confirm-delete-btn" (click)="confirmDelete()">Delete</button>
			</div>
		</div>
	</div>
	}

</div>
